<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a5c50">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="عيادة المصنع">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>عيادة المصنع</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: sidebar + content on wide screens; phone gets a bottom tab bar plus a side drawer like the original app. Clinic green, navy only for the company mark. */
:root{
  --bg:#f0f5f3; --surface:#ffffff; --surface2:#e8efec; --fg:#12201c; --muted:#566a63; --line:#d3deda;
  --brand:#0a5c50; --brand-hover:#08493f; --onbrand:#ffffff; --hero1:#064b42; --hero2:#12846f; --link:#0a5c50;
  --navy:#1d2a6b; --danger:#b3261e; --ok:#1b7a3f; --chip:#dcefe9; --chip-fg:#0a4a41; --focus:#1d6fe0;
  --inj-bg:#fbdcd9; --inj-fg:#7a1410; --sick-bg:#fdebc8; --sick-fg:#6b4300;
  --c-inj:#c0392b; --c-sick:#d98a00; --c-chk:#0f8a76;
  --font-display:'Cairo','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1311; --surface:#141d1a; --surface2:#1b2723; --fg:#e6efec; --muted:#93a8a0; --line:#27362f;
  --brand:#14806f; --brand-hover:#1a9582; --onbrand:#ffffff; --hero1:#0a3b34; --hero2:#10685b; --link:#5fd1bd;
  --navy:#a9b6ff; --danger:#ff8a80; --ok:#6fd49a; --chip:#1d3a33; --chip-fg:#bfe9de; --focus:#7db0ff;
  --inj-bg:#4a1f1c; --inj-fg:#ffc9c3; --sick-bg:#4a3a14; --sick-fg:#ffd98a;
  --c-inj:#ff8a7a; --c-sick:#f2b84b; --c-chk:#3fc2aa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1311; --surface:#141d1a; --surface2:#1b2723; --fg:#e6efec; --muted:#93a8a0; --line:#27362f;
  --brand:#14806f; --brand-hover:#1a9582; --onbrand:#ffffff; --hero1:#0a3b34; --hero2:#10685b; --link:#5fd1bd;
  --navy:#a9b6ff; --danger:#ff8a80; --ok:#6fd49a; --chip:#1d3a33; --chip-fg:#bfe9de; --focus:#7db0ff;
  --inj-bg:#4a1f1c; --inj-fg:#ffc9c3; --sick-bg:#4a3a14; --sick-fg:#ffd98a;
  --c-inj:#ff8a7a; --c-sick:#f2b84b; --c-chk:#3fc2aa; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.side{display:none}
.main{min-width:0;padding-block:0 96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{display:flex;align-items:center;gap:6px;color:var(--navy);font:800 11px/1 var(--font-display);letter-spacing:.08em;direction:ltr}
.mark svg{width:30px;height:26px}
.brand-name{font:700 19px var(--font-display)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.page{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ph h2{font-size:22px}

.hero{border-radius:24px;padding:26px 22px;color:#fff;background:linear-gradient(135deg,var(--hero1),var(--hero2));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-60px;inset-block-end:-90px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{font-size:clamp(22px,5.5vw,32px);font-weight:800}
.hero p{margin:6px 0 18px;opacity:.9;max-width:42ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;border:1px solid transparent;font-weight:600;background:var(--brand);color:var(--onbrand);transition:background .15s}
.btn:hover{background:var(--brand-hover)}
.btn.light{background:#fff;color:#064b42;position:relative;z-index:1}
.btn.light:hover{background:#e6f4f0}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h2{font-size:18px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.stat b{display:block;font:800 28px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.alert{border:1px solid var(--sick-fg);background:var(--sick-bg);color:var(--sick-fg);border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-weight:600;font-size:14px}
.field small,.meta{color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=month],input[type=number],select,textarea{
  width:100%;min-height:46px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:8px;align-items:stretch;min-width:0}
.row>select,.row>input{flex:1;min-width:0}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.chip.empty-stock{opacity:.6}
.chips.scroll{max-height:150px;overflow:auto;padding:2px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--chip-fg);font-size:13px}
.tag.ex{background:var(--surface2);color:var(--muted)}
.tag.warn,.tag.sick{background:var(--sick-bg);color:var(--sick-fg)}
.tag.injury{background:var(--inj-bg);color:var(--inj-fg)}
.err{color:var(--danger);font-size:14px}
.bad{color:var(--danger)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

.medrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.medrow .mn{font-weight:600;flex:1;min-width:110px;overflow-wrap:anywhere}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.stepper b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}

.filters{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.vlist{display:flex;flex-direction:column;gap:12px}
.visit{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.visit .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.visit h3{font-size:17px;overflow-wrap:anywhere}
.meta{font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.visit p{margin:0;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:16px}

.litem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.litem:last-of-type{border-bottom:0}
.litem span{overflow-wrap:anywhere}
.x{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--danger)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.seg button{flex:1;min-height:42px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--onbrand)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv span:first-child{color:var(--muted)}

.items{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item h3{font-size:17px;overflow-wrap:anywhere}
.big{font:800 26px/1 var(--font-display);font-variant-numeric:tabular-nums}
.big small{font:500 13px var(--font-body);color:var(--muted)}
.linkcard{text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.linkcard:hover{border-color:var(--brand)}

.bar{display:grid;grid-template-columns:minmax(70px,30%) minmax(0,1fr) auto;gap:10px;align-items:center;margin:9px 0}
.bar span{overflow-wrap:anywhere;font-size:14px}
.bar .track{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:6px}
.bar b{font-variant-numeric:tabular-nums}

.tabs{position:fixed;inset-inline:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px 2px;border-radius:12px}
.tabs button[aria-current="page"]{color:var(--link);font-weight:600}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;border:0;background:transparent;padding:0 14px;border-radius:12px;text-align:start;color:var(--fg)}
.nav-btn:hover{background:var(--surface2)}
.nav-btn[aria-current="page"]{background:var(--chip);color:var(--chip-fg);font-weight:600}
.drawer{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);border:0;width:100%}
.panel{position:absolute;inset-block:0;inset-inline-start:0;width:min(310px,86vw);background:var(--surface);
  padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;overflow:auto}

.auth{min-height:100vh;display:grid;place-items:center;padding-block:28px}
.auth-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.auth-card .hero{padding:22px}
.link{background:none;border:0;color:var(--link);padding:6px 0;text-decoration:underline;text-align:start}
.hint{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}

#toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:70;pointer-events:none;padding-inline:16px}
#toast div{background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:500;max-width:420px}
#toast div.bad{background:var(--danger);color:#fff}
#modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
#modal .box{background:var(--surface);border-radius:18px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:16px}

.only-m{display:grid}
@media (min-width:860px){
  .shell{grid-template-columns:240px minmax(0,1fr);gap:28px}
  .side{display:flex;flex-direction:column;gap:4px;padding-top:24px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding-bottom:20px}
  .tabs,.only-m,.drawer{display:none!important}
  .top .brand{display:none}
  .top{justify-content:flex-end}
  .main{padding-bottom:40px}
  #toast{bottom:24px}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2 .full{grid-column:1/-1}
  .filters{grid-template-columns:2fr 1fr 1fr}
  .lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  .items.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .repgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
}
.lists,.repgrid{display:flex;flex-direction:column;gap:14px}
@media (min-width:860px){.lists,.repgrid{display:grid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* polish */
.card,.stat,.item,.visit,.linkcard{box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 28px -18px rgba(8,60,50,.35)}
.card,.visit,.item,.linkcard{border-radius:20px}
.visit,.linkcard,.item{transition:box-shadow .2s,border-color .2s}
.visit:hover,.linkcard:hover{border-color:var(--brand)}
.top{box-shadow:0 8px 20px -18px rgba(0,0,0,.5)}
.hero::before{content:"";position:absolute;inset-inline-start:22px;inset-block-end:-1px;width:120px;height:90px;background:rgba(255,255,255,.07);clip-path:polygon(50% 0,100% 100%,0 100%)}
.hero>*{position:relative;z-index:1}
.stat b{color:var(--link)}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--chip);color:var(--chip-fg);font:800 19px var(--font-display)}
.vtop{display:flex;align-items:center;gap:12px;min-width:0}
.vmain{flex:1;min-width:0}
.vmain h3{font-size:17px;overflow-wrap:anywhere}
.vmain h3 small{font:500 13px var(--font-body);color:var(--muted)}
.vact{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--surface2);color:var(--fg)}
.ib.del{color:var(--danger)}
.visit .chips{gap:6px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--chip)}
.tabs button{transition:background .15s}
.tabs button[aria-current="page"]{background:var(--chip);color:var(--chip-fg)}
.nav-btn{border-radius:14px;min-height:46px}
.nav-btn[aria-current="page"]::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-radius:50%;background:var(--link)}
.hbox{border:1px solid var(--line);border-radius:16px;padding:2px 14px;background:var(--bg)}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .hn{font-weight:600;overflow-wrap:anywhere}
.hrow input{min-height:42px;text-align:center}
.hrow .meta{grid-column:1/-1}
@media (min-width:860px){.filters{grid-template-columns:2fr 1fr 1fr 1fr}}

/* standalone page */
html,body{margin:0}
[hidden]{display:none!important}
body:not(.is-admin) :is([data-act="delVisit"],[data-act="empDel"],[data-act="sDel"],[data-act="reqDel"],[data-act="hDel"],[data-act="delItem"],[data-act="placeDel"],[data-act="tempDel"],[data-act="scDel"],[data-act="campDel"]){display:none!important}
.state{text-align:center}
.state p{margin:0 0 14px}

/* v2: medical file, vitals, temps, dashboard, print */
input[type=time]{width:100%;min-height:46px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font:700 12px/20px var(--font-body);text-align:center;margin-inline-start:auto}
.tabs button{position:relative}
.tabs .badge{position:absolute;top:0;inset-inline-end:14%;margin:0}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vit{display:inline-flex;gap:5px;align-items:baseline;padding:3px 10px;border-radius:999px;background:var(--surface2);font-size:13px}
.vit.abn{background:var(--inj-bg);color:var(--inj-fg);font-weight:600}
.alert.danger{border-color:var(--inj-fg);background:var(--inj-bg);color:var(--inj-fg)}
.delta{font-size:12px;font-weight:700}
.delta.up{color:var(--danger)}.delta.down{color:var(--ok)}.delta.flat{color:var(--muted)}
.stat div{margin-top:2px}
.spark{width:100%;height:auto;display:block}
.sec-h{font-size:15px;margin:6px 0 0;color:var(--muted);font-weight:700}
.kv b{font-weight:600}
.pill-ok{background:var(--chip);color:var(--chip-fg)}
#printarea{display:none}
.pd{color:#000;font-family:var(--font-body)}
.pd h1{font-size:20pt;margin:0}
.pd .ph1{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0a5c50;padding-bottom:8px;margin-bottom:10px}
.pd h2{font-size:13pt;margin:14px 0 4px;border-bottom:1px solid #999;padding-bottom:2px}
.pd table{width:100%;border-collapse:collapse;margin:6px 0 12px}
.pd th,.pd td{border:1px solid #888;padding:4px 8px;text-align:start;font-size:11pt;vertical-align:top}
.pd th{background:#e8efec}
.pd .red{color:#b3261e;font-weight:700}
.pd .sig{display:flex;justify-content:space-between;gap:30px;margin-top:46px}
.pd .sig div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}
@media print{
 html,body{background:#fff!important;color:#000!important}
 body{padding:0!important}
 body::before{display:none!important}
 body>*:not(#printarea){display:none!important}
 #printarea{display:block!important;font-size:11pt}
 @page{margin:14mm}
 .pd h2,.pd table{break-inside:avoid}
}
.cb{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--surface);cursor:pointer}
.cb input{width:18px;height:18px;accent-color:var(--brand)}
.sc-live{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}

/* ===== modern interface (data-ui="pro"): dark-first dashboard look ===== */
:root[data-ui="pro"]{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eef1f5; --fg:#161a20; --muted:#687282; --line:#e1e6ec;
  --brand:#1f8f80; --brand-hover:#197a6d; --onbrand:#ffffff; --hero1:#126b5f; --hero2:#25a493; --link:#177d70;
  --chip:#dff3ef; --chip-fg:#145a50; --focus:#2f6fe0;
}
@media (prefers-color-scheme: dark){:root[data-ui="pro"]:not([data-theme="light"]){
  --bg:#13151a; --surface:#1b1e24; --surface2:#23272f; --fg:#e8ebef; --muted:#7d8591; --line:#2a2f37;
  --brand:#2f9e8f; --brand-hover:#38b3a2; --onbrand:#ffffff; --hero1:#123a36; --hero2:#1d7d70; --link:#4fd1bd;

:root[data-ui="pro"][data-theme="dark"]{

[data-ui="pro"] .card,[data-ui="pro"] .stat,[data-ui="pro"] .item,[data-ui="pro"] .visit,[data-ui="pro"] .linkcard{border-radius:14px;box-shadow:none}
[data-ui="pro"] .stat b{color:var(--fg)}
[data-ui="pro"] .stat.pro{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px}
[data-ui="pro"] .stat.pro b{font-size:30px;margin:4px 0}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-style:normal}
.tile svg{width:22px;height:22px}
.tile.t1{background:rgba(79,209,189,.15);color:#4fd1bd}
.tile.t2{background:rgba(106,167,255,.15);color:#6aa7ff}
.tile.t3{background:rgba(255,138,128,.15);color:#ff8a80}
.tile.t4{background:rgba(240,183,104,.16);color:#e9a94c}
.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.greet h1{font-size:clamp(22px,4vw,28px);font-weight:700}
.greet p{margin:4px 0 0;color:var(--muted)}
[data-ui="pro"] .btn{border-radius:10px}
[data-ui="pro"] .btn.ghost{background:var(--surface2)}
[data-ui="pro"] input[type=text],[data-ui="pro"] input[type=email],[data-ui="pro"] input[type=password],[data-ui="pro"] input[type=date],[data-ui="pro"] input[type=month],[data-ui="pro"] input[type=number],[data-ui="pro"] input[type=time],[data-ui="pro"] input[type=search],[data-ui="pro"] select,[data-ui="pro"] textarea{background:var(--surface2);border-radius:10px}
[data-ui="pro"] .seg{border-radius:10px;background:var(--surface2)}
[data-ui="pro"] .tag{border-radius:6px;font-size:12px;padding:2px 8px}
[data-ui="pro"] .alert{border-radius:12px}
[data-ui="pro"] .bar .track{height:8px}
[data-ui="pro"] .top{box-shadow:none;background:var(--surface)}
[data-ui="pro"] .hbox,[data-ui="pro"] .medrow{border-radius:12px}
[data-ui="pro"] .tabs{background:var(--surface)}
[data-ui="pro"] .nav-btn{min-height:40px;border-radius:10px;font-size:14px;position:relative}
[data-ui="pro"] .nav-btn[aria-current="page"]{background:var(--chip);color:var(--link);font-weight:600}
[data-ui="pro"] .nav-btn[aria-current="page"]::after{display:none}
[data-ui="pro"] .nav-btn[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--link)}
.nav-sec{padding:14px 12px 6px;font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sbrand,.ucard,.gsearch,.clock,.newbtn{display:none}
[data-ui="pro"] .sbrand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.slogo{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.slogo svg{width:22px;height:20px}
.sbrand b{display:block;font:700 15px var(--font-display)}
.sbrand small{color:var(--muted);font-size:12px}
[data-ui="pro"] .ucard{display:flex;align-items:center;gap:10px;padding:10px;margin-top:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.uav{width:36px;height:36px;border-radius:10px;background:#d8a878;color:#2b1a0a;font:700 13px var(--font-display);display:grid;place-items:center;flex:none}
.uinfo{flex:1;min-width:0}
.uinfo b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uinfo small{color:var(--muted);font-size:11px}
[data-ui="pro"] .panel .ucard{margin-top:16px}
@media (min-width:860px){
  [data-ui="pro"] body{padding-inline:0}
  [data-ui="pro"] .shell{max-width:none;grid-template-columns:250px minmax(0,1fr);gap:0}
  [data-ui="pro"] .side{background:var(--surface);border-inline-end:1px solid var(--line);padding:16px 12px;gap:2px}
  [data-ui="pro"] .main{padding-inline:28px}
  [data-ui="pro"] .top{margin-inline:-28px;padding-inline:28px;justify-content:space-between}
  [data-ui="pro"] .top .brand{display:none}
  [data-ui="pro"] .gsearch{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:0 12px;width:min(420px,40vw)}
  [data-ui="pro"] .gsearch input{border:0;background:transparent;min-height:38px;padding:0;box-shadow:none}
  [data-ui="pro"] .gsearch svg{color:var(--muted)}
  [data-ui="pro"] .newbtn{display:inline-flex;white-space:nowrap}
  [data-ui="pro"] .clock{display:block;text-align:end;line-height:1.25;margin-inline-start:8px}
  [data-ui="pro"] .clock b{display:block;font-size:14px}
  [data-ui="pro"] .clock small{color:var(--muted);font-size:11px}
}

/* dashboard (modern look) */
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
.dcol{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:980px){.dash{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.panel2{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.ph2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.ph2 h2{font-size:16px;margin:0}
.ph2 small{color:var(--muted);display:block;margin-top:2px;font-size:12px}
.rng{display:inline-flex;gap:2px;background:var(--surface2);border-radius:10px;padding:3px}
.rng button{border:0;background:transparent;border-radius:8px;padding:4px 12px;font-size:13px;color:var(--muted)}
.rng button[aria-pressed="true"]{background:var(--chip);color:var(--link);font-weight:600}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.mini{background:var(--surface2);border-radius:10px;padding:10px 12px;min-width:0}
.mini>small{display:block;color:var(--muted);font-size:12px}
.mini b{font:700 22px/1.2 var(--font-display);display:block;font-variant-numeric:tabular-nums}
.sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sub.up{color:var(--ok)}.sub.dn{color:var(--c-sick)}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;border-bottom:1px solid var(--line)}
.bc{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bc i{display:block;width:100%;max-width:40px;border-radius:6px 6px 0 0;background:var(--brand);opacity:.55;min-height:3px}
.bc.now i{opacity:1}
.bc em{font-style:normal;font-size:11px;color:var(--muted);min-height:14px}
.blab{display:flex;gap:6px;margin-top:6px}
.blab span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap}
.alist{display:flex;flex-direction:column;gap:10px}
.al{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:10px;padding:10px 12px}
.al .ai{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.al .ai.crit{background:var(--inj-bg);color:var(--inj-fg)}
.al .ai.warn{background:var(--sick-bg);color:var(--sick-fg)}
.al>div{min-width:0;flex:1}
.al b{display:block;font-size:14px;overflow-wrap:anywhere}
.al small.crit{color:var(--inj-fg)}.al small.warn{color:var(--sick-fg)}
.al .lnk{background:none;border:0;color:var(--link);font-size:13px;font-weight:600;padding:6px}
.allbtn{margin-top:12px;width:100%;min-height:42px;border-radius:10px;border:0;background:var(--surface2);color:var(--fg);font-weight:600}
.allbtn:hover{background:var(--chip);color:var(--link)}
.tcount{background:var(--sick-bg);color:var(--sick-fg);border-radius:999px;font-size:12px;padding:2px 10px;white-space:nowrap}
.tbl{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);font-size:14px}
.tr.th{border-top:0;font-size:12px;color:var(--muted);padding-block:4px}
.tr .who{display:flex;align-items:center;gap:10px;min-width:0}
.tr .who .av{width:34px;height:34px;font-size:14px}
.tr .who b{display:block;font-size:14px;overflow-wrap:anywhere}
.tr .who small{color:var(--muted);font-size:12px}
.tr .tm{font-size:13px;color:var(--muted)}
.tr.th .vact{visibility:hidden}
.dbar{margin:14px 0}
.dbar .dh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.dbar .track{height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.dbar .track i{display:block;height:100%;border-radius:4px}
.cnt{margin-inline-start:auto;background:var(--chip);color:var(--chip-fg);border-radius:999px;font-size:11px;font-weight:600;padding:1px 8px}
.ndot{width:8px;height:8px;border-radius:50%;background:var(--c-sick);margin-inline-start:auto;display:inline-block}
.bellb{position:relative}
.bellb .ndot{position:absolute;top:8px;inset-inline-end:9px;margin:0;background:var(--danger)}
@media (max-width:640px){.tr{grid-template-columns:minmax(0,1fr) auto auto}.tr .c-dept,.tr .c-time{display:none}.minis{gap:8px}.mini b{font-size:19px}}
/* v14: profile photo + display preferences */
.uav{overflow:hidden}
.uav img,.hav img{width:100%;height:100%;object-fit:cover;display:block}
.avbig{width:88px;height:88px;border-radius:50%;font-size:28px}
.hav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#d8a878;color:#2b1a0a;font:700 13px var(--font-display);display:grid;place-items:center;overflow:hidden;padding:0;flex:none;cursor:pointer}
@media (max-width:640px){.top .hav{display:none}}

}

/* atomic stock change on the server so two nurses dispensing together do not overwrite each other */
function adjust(name,delta){
 var s=findStock(name);if(!s||!delta)return 0;
 var before=s.qty;s.qty=Math.max(0,s.qty+delta);
 if(SNAP.stock[s.id]){
  SNAP.stock[s.id]=JSON.stringify(SPEC.stock.to(s));
  inflight++;
  syncQ=syncQ.then(function(){
   return sb.rpc('fc_adjust_stock',{p_name:name,p_delta:delta}).then(function(r){
    if(r.error)throw r.error;
    if(typeof r.data==='number'&&r.data!==s.qty){s.qty=r.data;SNAP.stock[s.id]=JSON.stringify(SPEC.stock.to(s));}
   });
  }).catch(onErr).then(function(){inflight--;});
 }
 return s.qty-before;
}

/* inner cabinet (sealed boxes): atomic on the server, same idea as adjust() */
function rpcStock(fn,args,s){
 if(!SNAP.stock[s.id])return;
 SNAP.stock[s.id]=JSON.stringify(SPEC.stock.to(s));
 inflight++;
 syncQ=syncQ.then(function(){
  return sb.rpc(fn,args).then(function(r){
   if(r.error)throw r.error;
   var d=r.data;
   if(d&&typeof d==='object'){s.qty=d.qty;s.boxes=d.boxes;s.perBox=d.per_box;s.lots=d.lots||[];s.outerExp=d.outer_exp||'';SNAP.stock[s.id]=JSON.stringify(SPEC.stock.to(s));}
  });
 }).catch(onErr).then(function(){inflight--;});
}
/* expiry batches of the inner cabinet: [{exp:'YYYY-MM' or '', boxes:n}] */
function lotsAdd(l,e,n){
 var m={};(l||[]).forEach(function(x){m[x.exp||'']=(m[x.exp||'']||0)+x.boxes;});
 e=e||'';m[e]=(m[e]||0)+n;

}
function lotsList(m){return Object.keys(m).filter(function(k){return m[k]>0;}).sort(function(a,b){return (a===''?1:0)-(b===''?1:0)||(a<b?-1:a>b?1:0);}).map(function(k){return {exp:k,boxes:m[k]};});}
function lotsTake(l,e,n){
 e=e||'';var rem=n,m={};
 var order=(l||[]).slice().sort(function(a,b){var ae=(a.exp||'')===e?0:1,be=(b.exp||'')===e?0:1;return ae-be||((a.exp===''?1:0)-(b.exp===''?1:0))||((a.exp||'')<(b.exp||'')?-1:1);});
 order.forEach(function(x){var tk=Math.min(rem,x.boxes);rem-=tk;if(x.boxes-tk>0)m[x.exp||'']=(m[x.exp||'']||0)+x.boxes-tk;});
 return lotsList(m);
}
/* lots plus any boxes recorded without a date (older data) */
function lotsFull(s){
 var l=(s.lots||[]).map(function(x){return {exp:x.exp||'',boxes:x.boxes};}),sum=0;l.forEach(function(x){sum+=x.boxes;});
 if((s.boxes||0)>sum)l=lotsAdd(l,'',s.boxes-sum);

}
function withdrawBox(s,n,pb,exp,nurse){

 s.qty+=n*pb;s.boxes-=n;s.perBox=pb;s.lots=lotsTake(lotsFull({lots:s.lots,boxes:s.boxes+n}),exp,n);

function fetchAll(table,desc){

 function page(i){
  return sb.from(table).select('*').order('created_at',{ascending:!desc}).order('id').range(i*size,i*size+size-1).then(function(r){
   if(r.error)throw r.error;
   var d=r.data||[];out=out.concat(d);
   if(d.length===size&&i<9)return page(i+1);
   return out;
  });
 }

}

function sortV(v){return v.slice().sort(function(a,b){var ka=a.date+' '+(a.time||''),kb=b.date+' '+(b.time||'');return ka<kb?1:ka>kb?-1:0;});}
function byName(a,b){return String(a.name).localeCompare(String(b.name),'ar');}
function sortedStock(){return S.stock.slice().sort(byName);}
function findStock(name){return S.stock.filter(function(s){return s.name===name;})[0];}
function recalcPlan(){
 var vs=0,ms=0;
 S.visits.forEach(function(x){var ch=false;(x.meds||[]).forEach(function(m){var st=findStock(m.name);if(!st||!(st.cost>0))return;var nc=unitCost(st);if(nc!==m.cost){ch=true;ms++;}});if(ch)vs++;});
 return {visits:vs,meds:ms};
}
function recalcApply(){
 S.visits.forEach(function(x){(x.meds||[]).forEach(function(m){var st=findStock(m.name);if(!st||!(st.cost>0))return;m.cost=unitCost(st);});});
 save('visits');
}
function unitCost(s){var c=s.cost||0,pb=s.perBox||0;return pb>0?Math.round(c/pb*10000)/10000:c;}
function totalUnits(s){return (s.qty||0)+(s.boxes||0)*(s.perBox||0);}
function lowItems(){return S.stock.filter(function(s){return totalUnits(s)<=s.min;});}
function empVisits(e){return S.visits.filter(function(v){return v.empRef===e.id;});}
function empMatch(name,empId){
 var n=(name||'').trim(),id=(empId||'').trim();
 return S.employees.filter(function(e){return (id&&e.empId&&e.empId===id)||e.name===n;})[0];
}

function monthLong(m){var p=m.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString(S.lang==='ar'?'ar-EG-u-nu-latn':'en-GB',{month:'long',year:'numeric'});}
function visitUnits(v){var n=0;(v.meds||[]).forEach(function(m){n+=(+m.qty||0);});return n;}
function usedMonth(name,empId,month,exceptId){
 var e=empMatch(name,empId),nm=(name||'').trim(),n=0;
 S.visits.forEach(function(v){
  if(v.id===exceptId||v.date.slice(0,7)!==month)return;
  var same=e?(v.empRef===e.id||(!v.empRef&&v.worker===e.name)):(v.worker===nm);
  if(same)n+=visitUnits(v);
 });
 return n;
}
function allowInfo(d){
 var name=(d.worker||'').trim();if(!name||!S.limit)return null;
 var mo=(d.date||today()).slice(0,7),used=usedMonth(name,d.empId,mo,S.editing),cur=visitUnits(d);
 return {used:used,cur:cur,total:used+cur,limit:S.limit,left:S.limit-used-cur,month:mo};
}

function empAllow(e){

/* ---------- stock helpers ---------- */
var EXP_SOON=60;
function daysTo(d){if(!d)return null;var p=d.split('-'),n=new Date();return Math.round((new Date(+p[0],+p[1]-1,+p[2])-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);}
function addD(d,n){var p=d.split('-'),x=new Date(+p[0],+p[1]-1,+p[2]);x.setDate(x.getDate()+n);return ds(x);}
/* Expiry is tracked per batch (month/year): boxes in the inner cabinet by lot, plus the loose units in the outer cabinet. */
function ymEnd(ym){var p=ym.split('-');return p[0]+'-'+p[1]+'-'+String(new Date(+p[0],+p[1],0).getDate()).padStart(2,'0');}
function fmtYM(ym){if(!ym)return t('noExp');var p=ym.split('-');return p[1]+'/'+p[0];}
function stockLots(s){
 var out=lotsFull(s).filter(function(l){return l.exp;}).map(function(l){return {exp:l.exp,boxes:l.boxes,outer:false};});
 if(s.qty>0&&s.outerExp)out.push({exp:s.outerExp,qty:s.qty,outer:true});
 return out.sort(function(a,b){return a.exp<b.exp?-1:a.exp>b.exp?1:0;});
}
function expDate(s){var l=stockLots(s);return l.length?l[0].exp:'';}
function expState(s){if(!(totalUnits(s)>0))return '';var e=expDate(s);if(!e)return '';var d=daysTo(ymEnd(e));return d<0?'expired':d<=EXP_SOON?'soon':'';}
function expItems(){return S.stock.filter(function(s){return expState(s)!=='';});}
function addMove(name,diff,kind,note,nurse,exp){
 if(!diff&&!(kind==='adj'&&exp!==undefined))return;
 S.moves.unshift({id:uid(),date:today(),time:nowTime(),name:name,qty:diff,kind:kind,note:note||'',nurse:nurse||'',exp:exp||''});
 S.moves=S.moves.slice(0,500);
}
function stockApply(v,sign){
 (v.meds||[]).forEach(function(m){
  var applied=adjust(m.name,-sign*m.qty);
  if(applied)addMove(m.name,applied,sign>0?'out':'in',v.worker,v.officer);
 });
 save('stock','moves');
}
function receiveStock(name,boxes,perBox,note,exp,nurse){
 var s=findStock(name);if(!s)return false;
 var units=boxes*perBox;
 s.boxes+=boxes;s.perBox=perBox;s.lots=lotsAdd(lotsFull({lots:s.lots,boxes:s.boxes-boxes}),exp,boxes);
 rpcStock('fc_adjust_boxes',{p_name:name,p_delta:boxes,p_per_box:perBox,p_exp:exp||''},s);
 addMove(name,units,'in',note||(boxes+' '+t('boxWord')+(exp?' · '+fmtYM(exp):'')),nurse,exp?exp+'-01':'');
 save('stock','moves');return true;
}

/* ---------- visits ---------- */
function vitFlags(v){
 var f={};if(!v)return f;
 if(isSet(v.sys)&&(+v.sys>=140||+v.sys<90))f.sys=1;
 if(isSet(v.dia)&&(+v.dia>=90||+v.dia<60))f.dia=1;
 if(isSet(v.pulse)&&(+v.pulse>100||+v.pulse<60))f.pulse=1;
 if(isSet(v.temp)&&(+v.temp>=38||+v.temp<35.5))f.temp=1;
 if(isSet(v.resp)&&(+v.resp>20||+v.resp<12))f.resp=1;
 if(isSet(v.spo2)&&+v.spo2<95)f.spo2=1;
 return f;
}
function vitWarn(v){
 var f=vitFlags(v),n=[];
 if(f.sys||f.dia)n.push(t('v_bp'));if(f.pulse)n.push(t('v_pulse'));if(f.temp)n.push(t('v_temp'));if(f.resp)n.push(t('v_resp'));if(f.spo2)n.push('SpO₂');
 return n.length?t('vitAbn')+': '+n.join('، '):'';
}
function vitChips(v){
 if(!v)return '';var f=vitFlags(v),out=[];
 if(isSet(v.sys)||isSet(v.dia))out.push(['bp',(isSet(v.sys)?v.sys:'?')+'/'+(isSet(v.dia)?v.dia:'?'),f.sys||f.dia]);
 if(isSet(v.pulse))out.push(['pulse',v.pulse,f.pulse]);
 if(isSet(v.temp))out.push(['temp',v.temp+'°',f.temp]);
 if(isSet(v.resp))out.push(['resp',v.resp,f.resp]);
 if(isSet(v.spo2))out.push(['spo2',v.spo2+'%',f.spo2]);
 return out.map(function(o){return '<span class="vit'+(o[2]?' abn':'')+'">'+esc(t('v_'+o[0]))+' <b dir="ltr">'+esc(o[1])+'</b></span>';}).join('');
}
function allergyHits(emp,meds){
 var out=[];if(!emp||!emp.allergies)return out;
 var toks=emp.allergies.toLowerCase().split(/[,،;؛\n\/]+/).map(function(x){return x.trim();}).filter(function(x){return x.length>=2;});
 (meds||[]).forEach(function(m){
  var st=findStock(m.name),names=[m.name,st?st.ingredient:''].filter(Boolean).map(function(x){return x.toLowerCase();});
  toks.forEach(function(a){
   if(names.some(function(n){return n.indexOf(a)>-1||(n.length>=3&&a.indexOf(n)>-1);}))out.push({med:m.name,allergen:a});
  });
 });
 return out;
}
function allergyBox(){
 var d=S.draft;if(!d)return '';

function bars(rows,color){

}
function repData(){

 function sorted(o){return Object.keys(o).map(function(k){return [k,o[k]];}).sort(function(a,b){return b[1]-a[1];});}
 var trend=[],d=new Date();d.setDate(1);
 for(var i=5;i>=0;i--){var dd=new Date(d.getFullYear(),d.getMonth()-i,1);var key=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0');
  trend.push([monthLabel(key),S.visits.filter(function(x){return x.date.slice(0,7)===key;}).length]);}
 return {vs:vs,bt:bt,depts:sorted(bd),meds:sorted(bm).slice(0,8),trend:trend};
}

/* ---------- helpers: numbers ---------- */
function fnum(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?NaN:n;}
function fm(n){return String(Math.round(n*100)/100);}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function prevMonth(m){var p=m.split('-');return monthKey(new Date(+p[0],+p[1]-2,1));}
function sortedPairs(o){return Object.keys(o).map(function(k){return [k,o[k]];}).sort(function(a,b){return b[1]-a[1];});}
function delta(c,p){
 if(c===p)return '<span class="delta flat">=</span>';
 if(!p)return '<span class="delta up" dir="ltr">▲</span>';
 var pc=Math.round((c-p)/p*100);
 return '<span class="delta '+(pc>0?'up':'down')+'" dir="ltr">'+(pc>0?'▲ +':'▼ ')+pc+'%</span>';
}

/* ---------- analytics ---------- */
function analyze(m){
 var vs=S.visits.filter(function(x){return x.date.slice(0,7)===m;});
 var a={m:m,vs:vs,visits:vs.length,injuries:0,workInj:0,sick:0,checkups:0,leaveDays:0,leaveCases:0,refs:[],medQty:0,cost:0,injDept:{},visDept:{},reasons:{},meds:{},emps:{}};
 vs.forEach(function(x){
  var ty=x.type||'checkup',dp=x.dept||'-';
  if(ty==='injury'){a.injuries++;if(x.workRelated!==false)a.workInj++;a.injDept[dp]=(a.injDept[dp]||0)+1;}
  else if(ty==='sick')a.sick++;else a.checkups++;
  a.visDept[dp]=(a.visDept[dp]||0)+1;
  a.emps[x.empRef||x.worker]=1;
  var ld=+x.leaveDays||0;
  if(ld>0){a.leaveDays+=ld;a.leaveCases++;var rs=(x.diagnosis||x.complaint||t('unspecified')).trim();var o=a.reasons[rs]||(a.reasons[rs]={n:0,d:0});o.n++;o.d+=ld;}
  if(x.referred)a.refs.push(x);
  (x.meds||[]).forEach(function(md){a.medQty+=md.qty;var c=md.qty*(md.cost||0);a.cost+=c;var o2=a.meds[md.name]||(a.meds[md.name]={q:0,c:0});o2.q+=md.qty;o2.c+=c;});
 });
 a.nEmps=Object.keys(a.emps).length;
 a.avgMed=a.visits?a.medQty/a.visits:0;
 a.avgCost=a.visits?a.cost/a.visits:0;
 var ts=S.temps.filter(function(r){return r.date.slice(0,7)===m;});
 a.tempN=ts.length;a.tempOut=ts.filter(tempOut).length;a.temps=ts;
 return a;
}
function trendRows(fn){
 var out=[],d=new Date();d.setDate(1);
 for(var i=5;i>=0;i--){var k=monthKey(new Date(d.getFullYear(),d.getMonth()-i,1));out.push([monthLabel(k),fn(k)]);}
 return out;
}
function reasonRows(a){return Object.keys(a.reasons).map(function(k){return [k+' ('+a.reasons[k].d+' '+t('days')+')',a.reasons[k].n];}).sort(function(x,y){return y[1]-x[1];}).slice(0,8);}

/* ---------- storage temperature ---------- */
function spark(p,rs){
 rs=rs.slice(0,14).reverse();
 if(rs.length<2)return '';
 var W=300,H=64,vals=rs.map(function(r){return r.temp;}),lo=Math.min.apply(null,vals.concat([p.min])),hi=Math.max.apply(null,vals.concat([p.max]));
 var pad=(hi-lo)*0.12||1;lo-=pad;hi+=pad;
 function y(v){return (H-((v-lo)/(hi-lo))*H).toFixed(1);}
 function x(i){return (8+i*((W-16)/(rs.length-1))).toFixed(1);}
 var pts=rs.map(function(r,i){return x(i)+','+y(r.temp);}).join(' ');
 var dots=rs.map(function(r,i){return '<circle cx="'+x(i)+'" cy="'+y(r.temp)+'" r="3.2" fill="'+(tempOut(r)?'var(--danger)':'var(--brand)')+'"/>';}).join('');
 return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(p.name)+'"><rect x="0" y="'+y(p.max)+'" width="'+W+'" height="'+(y(p.min)-y(p.max)).toFixed(1)+'" fill="var(--chip)"/><polyline points="'+pts+'" fill="none" stroke="var(--brand)" stroke-width="2"/>'+dots+'</svg>';
}

/* ---------- print ---------- */
function printDoc(html,title){
 var pa=document.getElementById('printarea');
 pa.setAttribute('dir',document.documentElement.dir);
 pa.innerHTML='<div class="pd">'+html+'</div>';
 var old=document.title;if(title)document.title=title;
 function done(){pa.innerHTML='';document.title=old;window.removeEventListener('afterprint',done);}
 window.addEventListener('afterprint',done);
 setTimeout(function(){try{window.print();}catch(e){done();}},60);

function nv(x){return (isSet(x)&&!isNaN(+x))?+x:null;}
function bpClass(s,d){
 var a=isSet(s)?+s:0,b=isSet(d)?+d:0;if(!a&&!b)return '';
 if(a>=140||b>=90)return 'high';
 if((a&&a<90)||(b&&b<60))return 'low';
 if(a>=130||b>=85)return 'border';
 return 'ok';
}
function sugarClass(v,ty){
 if(!isSet(v))return '';var x=+v;
 if(x<70)return 'low';
 if(ty==='fasting')return x>=126?'high':x>=100?'border':'ok';
 return x>=200?'high':x>=140?'border':'ok';
}
var RANK={'':0,ok:0,border:1,low:2,high:3};
function scRisk(r){return Math.max(RANK[bpClass(r.sys,r.dia)],RANK[sugarClass(r.sugar,r.sugarType)]);}
function clsTag(c,label,val){if(!c)return '';return '<span class="tag '+(c==='high'?'injury':(c==='ok'?'':'sick'))+'">'+esc(label)+' <bdi dir="ltr">'+esc(val)+'</bdi> · '+esc(t('c_'+c))+'</span>';}
function bmiOf(w,h){return (w&&h)?Math.round(w/Math.pow(h/100,2)*10)/10:null;}
function bpText(r){return (isSet(r.sys)||isSet(r.dia))?((isSet(r.sys)?r.sys:'?')+'/'+(isSet(r.dia)?r.dia:'?')):'';}
function scTags(r){
 var o='',b=bpText(r);
 if(b)o+=clsTag(bpClass(r.sys,r.dia),t('v_bp'),b);
 if(isSet(r.sugar))o+=clsTag(sugarClass(r.sugar,r.sugarType),t('sugarS'),r.sugar+' '+t(r.sugarType));
 return o;
}

 if(b)o.push(t('v_bp')+' '+b+' ('+t('c_'+bpClass(r.sys,r.dia))+')');
 if(isSet(r.sugar))o.push(t('sugarS')+' '+r.sugar+' '+t(r.sugarType)+' ('+t('c_'+sugarClass(r.sugar,r.sugarType))+')');

 var o={rs:rs,n:rs.length,hbp:0,hsg:0,border:0,chron:0,byDept:{},sS:0,nS:0,sD:0,sG:0,nG:0,attn:0};
 rs.forEach(function(r){
  var b=bpClass(r.sys,r.dia),g=sugarClass(r.sugar,r.sugarType),k=scRisk(r),dp=r.dept||'-';

 });

var navLast=null,navPop=false,rootBackAt=0;
function navSync(){
 if(!S.session||!S.loaded)return;
 try{
  if(navLast===null){history.replaceState({root:1},'');history.pushState({v:S.view},'');navLast=S.view;return;}
  if(S.view!==navLast){if(!navPop)history.pushState({v:S.view},'');navLast=S.view;}
 }catch(e){}
}
window.addEventListener('popstate',function(e){
 if(!S.session||!S.loaded||navLast===null)return;
 var st=e.state||{},md=document.getElementById('modal');
 try{
  if(md&&!md.hidden){md.hidden=true;md.innerHTML='';history.pushState({v:S.view},'');return;}
  if(S.menu){S.menu=false;history.pushState({v:S.view},'');render();return;}
  if(st.root){
   if(Date.now()-rootBackAt<2500){history.back();return;}
   rootBackAt=Date.now();toast(t('backExit'));history.pushState({v:S.view},'');return;
  }
 }catch(err){return;}
 var v=st.v||'home';
 if(v==='employee'&&!S.empId)v='employees';
 if(v==='empForm'&&!S.eDraft)v='employees';
 if(v==='new'&&!S.draft)v='visits';
 navPop=true;go(v);navPop=false;
});

function pickPhoto(inp){
 var f=inp.files&&inp.files[0];if(!f)return;
 if(!/^image\//.test(f.type)){toast(t('photoErr'),true);return;}
 var fr=new FileReader();
 fr.onerror=function(){toast(t('photoErr'),true);};
 fr.onload=function(){
  var im=new Image();
  im.onerror=function(){toast(t('photoErr'),true);};
  im.onload=function(){
   try{
    var n=256,c=document.createElement('canvas');c.width=n;c.height=n;
    var m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
    c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,n,n);
    S.photo=c.toDataURL('image/jpeg',0.82);
    store.set('photo_'+S.user.id,S.photo);
    render();toast(t('photoSaved'));
   }catch(e){toast(t('photoErr'),true);}
  };
  im.src=fr.result;
 };
 fr.readAsDataURL(f);
}

  try{navigator.clipboard.writeText(txt).then(function(){toast(t('copied'));},function(){toast(t('copyFail'),true);});}catch(e3){toast(t('copyFail'),true);}
 }
}
function P(el){return {v:el.getAttribute('data-v'),id:el.getAttribute('data-id'),list:el.getAttribute('data-list'),i:el.getAttribute('data-i'),d:el.getAttribute('data-d'),k:el.getAttribute('data-k'),n:el.getAttribute('data-n')};}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}

document.addEventListener('click',function(ev){
 var el=ev.target.closest('[data-act]');if(!el)return;
 act(el.getAttribute('data-act'),P(el));
});
document.addEventListener('input',function(ev){
 var el=ev.target,f=el.getAttribute('data-f'),fl=el.getAttribute('data-fl');
 if(el.getAttribute('data-sq')!==null){S.sq=el.value;var sl=document.getElementById('slist');if(sl)sl.innerHTML=stockListHtml();return;}
 var sc=el.getAttribute('data-sc');
 if(sc&&S.scDraft){S.scDraft[sc]=el.value;updScrLive();return;}
 var cd=el.getAttribute('data-cond');
 if(cd&&S.scDraft){var ci=S.scDraft.conds.indexOf(cd);if(el.checked&&ci<0)S.scDraft.conds.push(cd);if(!el.checked&&ci>-1)S.scDraft.conds.splice(ci,1);return;}
 if(f&&S.draft){
  var dot=f.indexOf('.');
  if(dot>0){
   var g=f.slice(0,dot),k=f.slice(dot+1);if(!S.draft[g])S.draft[g]={};S.draft[g][k]=el.value;
   if(g==='vitals'){var vf=document.getElementById('vit-flags');if(vf)vf.textContent=vitWarn(S.draft.vitals);}
  }else S.draft[f]=el.value;
  if(f==='returnDate')S.draft.retManual=!!el.value;
  if((f==='leaveDays'||f==='date')&&!S.draft.retManual){
   var ld=parseInt(S.draft.leaveDays,10)||0;
   S.draft.returnDate=(ld>0&&S.draft.date)?addD(S.draft.date,ld):'';
   var rdI=document.getElementById('f-returnDate');if(rdI)rdI.value=S.draft.returnDate;
  }
  if(f==='worker'||f==='empId'){var h=document.getElementById('emp-hint');if(h)h.textContent=empHint();var ab0=document.getElementById('allergy-box');if(ab0)ab0.innerHTML=allergyBox();}
  if(f==='worker'||f==='empId'||f==='date'){var al0=document.getElementById('allow-box');if(al0)al0.innerHTML=allowBox();}
 }
 if(fl){
  S.filters[fl]=el.value;
  if(S.view==='visits'){var l=document.getElementById('vlist');if(l)l.innerHTML=visitsListHtml();}
  if(S.view==='employees'){var l2=document.getElementById('elist');if(l2)l2.innerHTML=empListHtml();}
 }
});
document.addEventListener('change',function(ev){
 var el=ev.target;
 if(el.getAttribute('data-photo')){pickPhoto(el);return;}
 if(el.getAttribute('data-al')){S.al.period=el.value;render();return;}
 if(el.getAttribute('data-ij')){S.ij[el.getAttribute('data-ij')]=el.value;render();return;}
 if(el.getAttribute('data-sc')==='name'&&S.scDraft){scNameChanged();return;}
 if(el.getAttribute('data-fp')){S.period=el.value;render();return;}
 if(el.getAttribute('data-f')==='worker'&&S.draft){
  var e=empMatch(el.value,'');
  if(e){
   if(!S.draft.empId&&e.empId){S.draft.empId=e.empId;var i=document.getElementById('f-empId');if(i)i.value=e.empId;}
   if(!S.draft.dept&&e.dept){S.draft.dept=e.dept;var s=document.getElementById('f-dept');if(s)s.value=e.dept;}
  }
  var h=document.getElementById('emp-hint');if(h)h.textContent=empHint();
  var ab=document.getElementById('allergy-box');if(ab)ab.innerHTML=allergyBox();
  var al1=document.getElementById('allow-box');if(al1)al1.innerHTML=allowBox();
 }
});
document.addEventListener('keydown',function(ev){
 var en=ev.target.getAttribute&&ev.target.getAttribute('data-enter');
 if(ev.key==='Enter'&&en){ev.preventDefault();act(en,P(ev.target));}
 if(ev.key==='Escape'){var m=document.getElementById('modal');if(!m.hidden){m.hidden=true;m.innerHTML='';}if(S.menu){S.menu=false;render();}}
});

function empRead(){return {job:val('e-job'),phone:val('e-phone'),blood:document.getElementById('e-blood').value,allergies:val('e-allergies'),chronic:val('e-chronic'),notes:val('e-notes')};}
function authErr(msg){S.err=msg;var e=document.getElementById('auth-err');if(e)e.textContent=msg;}
document.addEventListener('submit',function(ev){
 var form=ev.target.getAttribute('data-form');if(!form)return;
 ev.preventDefault();
 var re=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
 if(form==='login'){
  var em=val('l-email').toLowerCase(),pw=document.getElementById('l-pass').value;
  if(!em||!pw){authErr(t('badLogin'));return;}
  var btn=ev.target.querySelector('button[type=submit]');if(btn)btn.disabled=true;
  sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
   if(r.error||!r.data||!r.data.user){authErr(t('badLogin'));if(btn)btn.disabled=false;return;}
   S.err='';S.view='home';startSession(r.data.user);
  }).catch(function(){authErr(t('syncErr'));if(btn)btn.disabled=false;});
 }else if(form==='forgot'){
  var em3=val('f-email').toLowerCase();
  if(!re.test(em3)){authErr(t('badEmail'));return;}
  sb.auth.resetPasswordForEmail(em3,{redirectTo:location.origin+location.pathname}).then(function(r){
   if(r.error){authErr(r.error.message);return;}
   S.auth='login';S.err='';render();toast(t('resetSent'));
  });
 }else if(form==='recover'){
  var np=document.getElementById('f-pass').value;
  if(np.length<6){authErr(t('shortPass'));return;}
  sb.auth.updateUser({password:np}).then(function(r){
   if(r.error){authErr(r.error.message);return;}
   S.recovering=false;try{history.replaceState(null,'',location.pathname);}catch(e){}
   toast(t('passSet'));
   sb.auth.getSession().then(function(g){var u=g.data&&g.data.session&&g.data.session.user;if(u)startSession(u);else resetState();});
  });
 }else if(form==='visit'){
  submitVisit();
 }else if(form==='pass'){
  var o=document.getElementById('p-old').value,nw=document.getElementById('p-new').value,pe=document.getElementById('pass-err');
  if(nw.length<6){pe.textContent=t('shortPass');return;}
  sb.auth.signInWithPassword({email:S.user.email,password:o}).then(function(r){
   if(r.error){pe.textContent=t('passBad');return;}
   return sb.auth.updateUser({password:nw}).then(function(r2){
    if(r2.error){pe.textContent=r2.error.message;return;}
    pe.textContent='';document.getElementById('p-old').value='';document.getElementById('p-new').value='';
    toast(t('passDone'));
   });
  });
 }else if(form==='emp'){
  var d=S.eDraft,nm=val('e-name'),eid=val('e-id'),dp=document.getElementById('e-dept').value,ee=document.getElementById('e-err');
  if(!nm){ee.textContent=t('needEmpName');return;}
  var dup=S.employees.filter(function(x){return eid&&x.empId===eid&&x.id!==d.id;})[0];
  if(dup){ee.textContent=t('empDup');return;}
  if(d.id){
   var cur2=S.employees.filter(function(x){return x.id===d.id;})[0];
   cur2.name=nm;cur2.empId=eid;cur2.dept=dp;Object.assign(cur2,empRead());
   S.visits.forEach(function(x){if(x.empRef===d.id){x.worker=nm;x.empId=eid;}});
   S.empId=d.id;S.view='employee';
  }else{
   var ne=Object.assign({id:uid(),name:nm,empId:eid,dept:dp},empRead());S.employees.push(ne);S.empId=ne.id;S.view='employee';
  }
  save('employees','visits');render();toast(t('empSaved'));
 }else if(form==='stockAdd'){
  var sn=val('sa-name'),sq=num(val('sa-qty')),sm=num(val('sa-min')),se=document.getElementById('sa-err'),sbx=num(val('sa-boxes')),spb=num(val('sa-pb'));
  if(isNaN(sbx))sbx=0;if(isNaN(spb))spb=0;
  if(!sn){se.textContent=t('needName');return;}
  if(isNaN(sq)||sq<0||isNaN(sm)||sm<0){se.textContent=t('needQty');return;}
  if(sbx>0&&!(spb>0)){se.textContent=t('needPerBox');return;}
  if(findStock(sn)){se.textContent=t('exists');return;}
  S.stock.push({id:uid(),name:sn,qty:sq,boxes:sbx,perBox:spb,lots:sbx>0?[{exp:val('sa-exp')||'',boxes:sbx}]:[],outerExp:sq>0?(val('sa-exp')||''):'',unit:'قرص',min:sm,cost:Math.max(0,fnum(val('sa-cost'))||0),ingredient:val('sa-ing'),expiry:''});
  if(sq+sbx*spb)addMove(sn,sq+sbx*spb,'in','',S.user.name,val('sa-exp')?val('sa-exp')+'-01':'');
  save('stock','moves');render();toast(t('added'));
 }else if(form==='req'){
  var ri=val('rq-item'),rq=num(val('rq-qty')),re2=document.getElementById('rq-err');
  if(!ri){re2.textContent=t('needName');return;}
  if(!(rq>0)){re2.textContent=t('needQty');return;}
  S.requests.push({id:uid(),date:today(),item:ri,qty:rq,priority:document.getElementById('rq-pr').value,status:'new',note:val('rq-note')});
  save('requests');render();toast(t('reqAdded'));
 }else if(form==='uadd'){submitUserAdd();
 }else if(form==='scr'){submitScreening();
 }else if(form==='camp'){
  var cn=val('c-name'),cdt=val('c-date')||today();
  if(!cn){document.getElementById('c-err').textContent=t('needName');return;}
  var nc={id:uid(),name:cn,date:cdt};S.campaigns.unshift(nc);save('campaigns');S.camp=nc.id;S.scDraft=scNew();S.scFilter='all';render();window.scrollTo(0,0);toast(t('added'));
 }else if(form==='temp'){
  var pn=document.getElementById('t-place').value,pl=S.places.filter(function(x){return x.name===pn;})[0],tv=fnum(val('t-temp')),te=document.getElementById('t-err');
  if(!pl){te.textContent=t('needPlace');return;}
  if(isNaN(tv)||tv<-50||tv>80){te.textContent=t('needTemp');return;}
  var hv=fnum(val('t-hum'));
  var rec={id:uid(),date:val('t-date')||today(),time:val('t-time')||nowTime().slice(0,5),place:pn,temp:tv,humidity:isNaN(hv)?null:hv,min:pl.min,max:pl.max,note:val('t-note'),by:S.user.name};
  S.temps.unshift(rec);save('temps');render();
  if(tempOut(rec))toast(t('tempOutToast'),true);else toast(t('tempSaved'));
 }else if(form==='place'){
  var pnm=val('pl-name'),pmin=fnum(val('pl-min')),pmax=fnum(val('pl-max')),pe2=document.getElementById('pl-err');
  if(!pnm){pe2.textContent=t('needName');return;}
  if(isNaN(pmin)||isNaN(pmax)||pmax<=pmin){pe2.textContent=t('badRange');return;}
  if(S.places.some(function(x){return x.name===pnm;})){pe2.textContent=t('exists');return;}
  S.places.push({id:uid(),name:pnm,min:pmin,max:pmax});save('places');render();toast(t('added'));
 }else if(form==='limit'){
  var ln=num(val('lim-in'));
  if(isNaN(ln)||ln<0){toast(t('limitBad'),true);return;}
  S.limit=ln;
  sb.from('fc_settings').upsert({key:'monthly_limit',value:String(ln)}).then(function(r){if(r.error)onErr(r.error);});
  render();toast(t('limitSaved'));
 }else if(form==='hmedAdd'){
  var hn=val('hm-name'),hu=val('hm-unit')||'علبة',hee=document.getElementById('hm-err');
  if(!hn){hee.textContent=t('needName');return;}
  if(S.hmeds.some(function(x){return x.name===hn;})){hee.textContent=t('exists');return;}
  S.hmeds.push({id:uid(),name:hn,unit:hu});save('hmeds');render();toast(t('added'));
 }else if(form==='handover'){
  var he=document.getElementById('h-err'),pm=lastHandoverMeds();
  if(!S.lists.officers.length){he.textContent=t('needOfficers');return;}
  var hm=[];
  document.querySelectorAll('[data-hm]').forEach(function(inp){var n=num(inp.value),nm=inp.getAttribute('data-hm');hm.push({name:nm,qty:(isNaN(n)||n<0)?0:n,prev:pm[nm]});});
  if(!hm.length){he.textContent=t('hmEmpty');return;}
  S.handovers.push({id:uid(),date:val('h-date')||today(),time:nowTime(),shift:document.getElementById('h-shift').value,from:document.getElementById('h-from').value,to:document.getElementById('h-to').value,notes:val('h-notes'),meds:hm,low:hm.filter(function(x){return x.qty===0;}).map(function(x){return x.name;})});
  save('handovers');render();toast(t('hSaved'));
 }
});

var deferredInstall=null;
function isStandalone(){try{return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}catch(e){return false;}}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;if(S.session&&S.loaded&&(S.view==='settings'||S.view==='home'))render();});
window.addEventListener('appinstalled',function(){deferredInstall=null;if(S.view==='settings')render();});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
 window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
boot();
})();
